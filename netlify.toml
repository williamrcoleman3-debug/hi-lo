# Only declares where Netlify Functions live -- deliberately no [build]
# section here, so the build command / publish directory already
# configured in the Netlify dashboard keep working exactly as before.
# These two functions (verify-iap-receipt, app-store-notifications) exist
# because Apple's official App Store Server verification library doesn't
# run correctly on Supabase's Deno-based Edge Functions -- see the Remove
# Ads implementation notes for why. Everything else in this app stays on
# Supabase (Postgres RPCs) exactly as before.
[functions]
  directory = "netlify/functions"

# Served with no file extension, at a fixed path Apple's CDN fetches
# directly (never through the SPA) to verify the iOS app is allowed to
# handle hi-lo-game.com Universal Links -- see ios/App/App/App.entitlements
# and public/.well-known/apple-app-site-association, its source file.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# The iOS app's WKWebView loads this live URL directly (server.url in
# capacitor.config.json) instead of bundling a copy into the binary, so a
# device needs to always revalidate index.html rather than ever hold onto
# a stale copy indefinitely. Netlify's own default already sends
# max-age=0,must-revalidate here (confirmed live), so this is pinning that
# behavior explicitly in the repo rather than relying on an unstated
# platform default. Deliberately does NOT cover /assets/* below -- those
# are the actual opposite case.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Vite content-hashes every JS/CSS bundle filename (see index.html's
# <script>/<link> tags), so a changed file is always a new URL -- safe to
# cache for a full year. Confirmed live that Netlify's default was NOT
# already doing this (same max-age=0,must-revalidate as index.html on
# every asset request) -- this is the real gap this investigation found,
# just not the one suspected: assets were being needlessly re-validated on
# every load, not staying stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
