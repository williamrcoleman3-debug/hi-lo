# Only declares where Netlify Functions live -- deliberately no [build]
# section here, so the build command / publish directory already
# configured in the Netlify dashboard keep working exactly as before.
# These two functions (verify-iap-receipt, app-store-notifications) exist
# because Apple's official App Store Server verification library doesn't
# run correctly on Supabase's Deno-based Edge Functions -- see the Remove
# Ads implementation notes for why. Everything else in this app stays on
# Supabase (Postgres RPCs) exactly as before.
[functions]
  directory = "netlify/functions"

# Served with no file extension, at a fixed path Apple's CDN fetches
# directly (never through the SPA) to verify the iOS app is allowed to
# handle hi-lo-game.com Universal Links -- see ios/App/App/App.entitlements
# and public/.well-known/apple-app-site-association, its source file.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
